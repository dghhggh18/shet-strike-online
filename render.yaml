services:
  - type: web
    name: shatki-fps
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: shatki-profile-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHATKI_DATA_FILE
        value: /var/data/profiles.json
